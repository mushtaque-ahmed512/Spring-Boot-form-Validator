<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>login here </title>
<link
 rel="stylesheet" 
 href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
 integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" 
 crossorigin="anonymous" />
</head>
<body style="background:#e2e2e2 ">


<div class="container">
<div class="row mt-5">
<div class="col-md-6 offset-3">

<form class="bg-white p-4" th:action="@{/process}" th:object="${loginData}" method="post">
<h1 class="text-center">Login Here</h1>

  <div class="form-group ">
  
    <label for="exampleInputEmail1">Enter Name</label>
    <input type="text" 
    name="name"
    th:value="${loginData.name}"
    class="form-control" 
    id="exampleInputEmail1"
    th:classappend="${#fields.hasErrors('name') ? 'is-invalid': '' }" 
    aria-describedby="emailHelp">
    
    <div th:each="e : ${#fields.errors('name')}" th:text="${e}"  class="invalid-feedback">
      </div>
   
  </div>
  
  <div class="form-group">
    <label for="exampleInputPassword1">Enter Email</label>
    <input type="email"
    name="email"
    th:value="${loginData.email}"
     class="form-control"
     th:classappend="${#fields.hasErrors('email') ? 'is-invalid': '' }" 
      id="exampleInputPassword1">
      
       <div th:each="e : ${#fields.errors('email')}" th:text="${e}"  class="invalid-feedback">
      </div>
  </div>
  
  <div class="form-group form-check">
  
    <input type="checkbox"
    name="agreed"
     class="form-check-input"
      th:classappend="${#fields.hasErrors('agreed') ? 'is-invalid': '' }"  
     id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Agree term and condition</label>
    
      <div th:each="e : ${#fields.errors('agreed')}" th:text="${e}"  class="invalid-feedback">
      </div>
  </div>
  
  <div class="container text-center">
  <button 
  type="submit"
   class="btn btn-primary">Submit</button>
  </div>
</form>


</div>
</div>
</div>

</body>
</html>
